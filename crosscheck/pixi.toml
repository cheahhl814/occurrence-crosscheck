[workspace]
authors = ["AIx-BIO <noreply@aix-bio.example>"]
channels = ["conda-forge", "bioconda"]
name = "edna-crosscheck"
platforms = ["linux-64"]
# Tracks crosscheck/SKILL.md frontmatter `version: 1.1.0` — keep the two in sync.
version = "1.1.0"
description = "Phase 1 of the eDNA occurrence meta-stack: cross-checks ASV observations against GBIF/OBIS/WoRMS/FishBase and Bio-ORACLE/WorldClim environmental envelopes, realm-aware. Emits enriched.parquet, crosscheck_report.json, flagged_occurrences.tsv, review_queue.csv."
# The `anaconda` channel was dropped: it is a licensed default channel whose use
# carries ToS conditions, and every dependency here resolves from conda-forge +
# bioconda without it.
# `exclude-newer` bounds the re-solve to a known-good window so the env does not
# drift between machines. Bump it deliberately when you bump dependencies.
exclude-newer = "2026-10-22"

[tasks]
setup-fishbase = "Rscript -e 'if (!requireNamespace(\"rfishbase\", quietly=TRUE)) install.packages(\"rfishbase\", repos=\"https://cloud.r-project.org\")'"
crosscheck = "bash bin/run-crosscheck.sh"
species-list = "bash bin/run_species.sh"
coordinates-checklist = "bash bin/run_coordinates.sh"
genus-narrow = "bash bin/run_genus_narrow.sh"
species-images = "python3 crosscheck/species_images.py"
habitat-iucn = "python3 crosscheck/habitat_iucn.py"
update-check = "python3 bin/skill-update-check.py"
smoke-test = "python3 test/test_smoke.py"

[dependencies]
r-base = ">=4.5.3,<4.6"
r-duckdb = ">=1.5.5,<2"
r-arrow = ">=25.0.0,<26"
r-jsonlite = ">=2.0.0,<3"
r-dplyr = ">=1.2.1,<2"
python = "3.11.*"
pandas = ">=3.0.5,<4"
pyarrow = ">=25.0.0,<26"
duckdb = ">=1.5.5,<2"
requests = ">=2.34.2,<3"
xarray = ">=2026.7.0,<2027"
rasterio = ">=1.4.4,<2"
rioxarray = ">=0.19.0,<0.20"
netcdf4 = ">=1.7.4,<2"
numpy = ">=2.4.6,<3"
libuv = ">=1.52.1,<2"
